# Nginx delante de Daphne: HTTPS, compresión, archivos estáticos con caché y WebSockets.
# instalar_servidor.sh reemplaza __DOMINIO__ y __APP_DIR__; certbot agrega luego el bloque HTTPS.

# ── Rate limiting por IP: primera barrera contra inundaciones. Los límites finos por acción y por usuario
# (iniciar sesión, registrarse, subir archivos, Gotita…) los pone Django (App/seguridad.py y App/ratelimit.py).
# General: 50 peticiones/s por IP con ráfagas de 100 (un salón entero comparte la IP del Wi-Fi).
limit_req_zone $binary_remote_addr zone=smartdrop_ip:10m rate=50r/s;
# Inicio de sesión y registro (web y app): 30 por minuto por IP con ráfaga de 20; el resto de rutas no cuenta.
map $request_uri $sd_auth_limit_key {
    default                       "";
    ~^/(login|register)/          $binary_remote_addr;
    ~^/api/(login|register)/      $binary_remote_addr;
    ~^/auth/(login|registro)/     $binary_remote_addr;
}
limit_req_zone $sd_auth_limit_key zone=sd_auth:10m rate=30r/m;
# Una sola vez por archivo: repetirla hace fallar `nginx -t`.
limit_req_status 429;
limit_req_log_level warn;

upstream smartdrop_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;
    server_tokens off;                   # no anunciar la versión de Nginx

    client_max_body_size 60M;   # Django acepta hasta 50 MB de evidencia por reporte

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain font/ttf;

    # CSS/JS con hash en el nombre (dashboard.54a2e0934855.css): nunca cambian, caché de un año.
    location ~ "^/static/(.+\.[0-9a-f]{12}\.[A-Za-z0-9]+)$" {
        alias __APP_DIR__/staticfiles/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /static/ {
        alias __APP_DIR__/staticfiles/;
        expires 1h;
        access_log off;
    }

    # Las evidencias de los reportes no son públicas: Django revisa el enlace firmado y responde con
    # X-Accel-Redirect hacia /protegido/, que solo Nginx puede usar (internal).
    location /media/ {
        return 404;
    }

    location /protegido/ {
        internal;
        alias __APP_DIR__/media/;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        limit_req zone=smartdrop_ip burst=100 nodelay;
        limit_req zone=sd_auth burst=20 nodelay;
        proxy_pass http://smartdrop_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se reemplaza (no se agrega) lo que mande el cliente: Daphne toma de aquí la IP del visitante, y una
        # cabecera falsa permitía cambiar la IP del registro de válvulas y saltarse los límites por IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # WebSockets abiertos mucho tiempo (/ws/sensors/)
        proxy_send_timeout 3600s;
    }
}
